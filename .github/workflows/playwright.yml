name: Playwright Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Create .env file
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL || 'http://localhost:3000' }}" >> .env
          echo "TEST_USERNAME=${{ secrets.TEST_USERNAME || 'test@example.com' }}" >> .env
          echo "TEST_EMAIL=${{ secrets.TEST_EMAIL || 'test@example.com' }}" >> .env
          echo "TEST_PASSWORD=${{ secrets.TEST_PASSWORD || 'TestPassword123!' }}" >> .env

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 30

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-${{ matrix.shardIndex }}
          path: screenshots/
          retention-days: 30

  report:
    name: Publish Test Report
    if: always()
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Merge test reports
        run: |
          mkdir -p merged-report
          for dir in all-artifacts/playwright-report-*; do
            if [ -d "$dir" ]; then
              cp -r "$dir"/* merged-report/ 2>/dev/null || true
            fi
          done

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merged
          path: merged-report/
          retention-days: 30

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = 'all-artifacts/test-results-1/results.json';
            
            if (fs.existsSync(resultsPath)) {
              const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
              
              const comment = `## 🎭 Playwright Test Results
              
              **Status:** ${results.stats?.expected > 0 ? '✅ Passed' : '❌ Failed'}
              
              - ✅ Passed: ${results.stats?.expected || 0}
              - ❌ Failed: ${results.stats?.unexpected || 0}
              - ⏭️ Skipped: ${results.stats?.skipped || 0}
              - 🔁 Flaky: ${results.stats?.flaky || 0}
              
              View the full report in the workflow artifacts.
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  notify:
    name: Notify on Failure
    if: failure()
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Send notification
        run: |
          echo "Tests failed! Consider setting up Slack/Discord/Email notifications here."
          echo "You can use actions like:"
          echo "- slackapi/slack-github-action@v1"
          echo "- dawidd6/action-send-mail@v3"
